<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Security: only files from this site may load. No outside scripts, trackers or fonts. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light">
  {% seo %}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" href="{{ '/assets/icons/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/assets/icons/icon-32.png' | relative_url }}" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  <meta name="theme-color" content="#0B2545">
  <link rel="preload" href="{{ '/assets/fonts/archivo-latin-wdth-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% feed_meta %}
</head>
<body{% if site.data.theme.animate_hero == false %} class="no-motion"{% endif %}>
  {% include icons.html %}
  {% include nav.html %}
  <main id="top">
    {{ content }}
  </main>
  <footer>
    <div class="wrap">
      <span>© {{ 'now' | date: '%Y' }} {{ site.data.profile.name_first }} {{ site.data.profile.name_last }}</span>
      <span><a href="{{ '/blog/feed.xml' | relative_url }}">RSS</a> · Open to roles worldwide</span>
    </div>
  </footer>
  <dialog class="lightbox" id="lightbox" aria-label="Certificate"><button type="button" class="lb-close" aria-label="Close">×</button><img alt=""><p class="lb-cap"></p></dialog>
  <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
