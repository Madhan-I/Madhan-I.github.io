# =====================================================================
#  HOW YOUR WEBSITE LOOKS. Change a word, save, and the site updates.
#  Same rules as profile.yml: keep the spaces, no tabs.
# =====================================================================

# 1. COLOUR STYLE: pick one word.
#    dawn   = night sky with an orange-pink sunrise (current)
#    ocean  = deep navy with teal and aqua
#    forest = dark green with emerald and lime
#    royal  = deep violet with gold
#    steel  = charcoal with silver and electric blue (most corporate)
preset: dawn

# 2. FONT STYLE for big headings: pick one word.
#    bold    = wide, modern, strong (current)
#    classic = elegant serif, more traditional
display_font: bold

# 3. ANIMATION when someone opens the site. true or false.
animate_hero: true

# 4. SHOW OR HIDE SECTIONS. Set to false to hide one.
show:
  metrics: true
  about: true
  experience: true
  training: true
  certifications: true
  education: true
  writing: true
  contact: true

# 5. OPTIONAL: your own colours. Leave a line empty ("") to use the preset.
#    Use hex colour codes, e.g. "#FF8A3D". Find codes at htmlcolorcodes.com
colors:
  glow_1: ""        # gradient start (name, main button)
  glow_2: ""        # gradient middle
  glow_3: ""        # gradient end
  sky_top: ""       # top of the hero background
  sky_bottom: ""    # bottom of the hero background

# ---------------------------------------------------------------------
#  Preset definitions. You don't need to edit below this line.
