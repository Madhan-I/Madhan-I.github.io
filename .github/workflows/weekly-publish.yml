# Rebuilds the website every morning so blog posts dated in the future
# go live automatically on their date. Runs on GitHub; no outside service.
name: Publish scheduled posts

on:
  schedule:
    - cron: "45 0 * * *"   # every day at 06:15 India time
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask GitHub Pages to rebuild the site
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
