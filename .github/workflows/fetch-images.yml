# One-time helper: downloads the badge and award images listed in
# assets/badges/sources.txt into assets/badges/ so the site hosts its own copies.
name: Fetch badge images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          cd assets/badges
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -fsSL -A "Mozilla/5.0" -o "$name" "$url" && echo "ok $name" || echo "FAILED $name"
          done < sources.txt
          ls -la
      - name: Save to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898269+github-actions[bot]@users.noreply.github.com"
          git add assets/badges
          git commit -m "Add self-hosted badge and award images" || echo "nothing new"
          git push
