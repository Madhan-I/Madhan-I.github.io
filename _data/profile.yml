# Use | to start a new line in the heading.
about_title: "Delivery leader. Engineer by training. Teacher by habit."
about:
  - "Programmes call me when delivery has stalled and the stakes are high: millions of policyholders, regulated data, and executives who need a straight answer on whether a release will land."
  - "Today I run release governance at Atos for Manulife's Core API, Customer Engagement and Compliance AI products, reporting portfolio health directly to executive leadership. The portfolio holds a High health rating, with under 5% sprint variance. Before that, I spent three years on-site in Boston for John Hancock, where I restarted a platform programme that had been frozen for two years, cleared 400+ tickets in nine months and ran five modernisation initiatives across 20+ business divisions."
  - "I work alongside engineering, business and leadership as one team. Every view gets a fair hearing, and together we land on the solution that's right for the work, not the one with the loudest voice."
  - "My path into delivery was unusual, and it shapes how I lead. I started in live events, running VIP hospitality at IPL matches, then worked in healthcare claims, production support for Walmart and document platforms for Anthem and MetLife, before leading Scrum teams and release trains for TruStage, Allstate, John Hancock and Manulife. Along the way I've led onshore and offshore teams across time zones and, as a Microsoft Certified Trainer, trained more than 2,000 people."
  - "I hold a BE in Electrical & Electronics Engineering and I'm now studying for an MS in Computer Science, specialising in AI & ML, at Woolf University. That combination lets me work through AKS migrations and OAuth design with architects, then explain the trade-offs to a steering committee in plain language."

clients:
  - Manulife
  - John Hancock
  - Allstate
  - MetLife
  - Anthem / Elevance
  - Walmart
  - TruStage

