# Use | to start a new line in the heading.
about_title: "Delivery leader. Engineer by training. Teacher by habit."
about:
  - "Leaders call me when delivery is at risk and the stakes are high: millions of policyholders, regulated data and executives who need a straight answer on whether a release will land."
  - "My path was unusual: live events and VIP hospitality at IPL matches, then healthcare claims, production support and document platforms, then Scrum teams and release trains. I spent three years on-site in Boston for John Hancock, restarting a platform program frozen for two years. Today I run release governance at Atos for Manulife's Core API, Customer Engagement and Compliance AI products, reporting to executive leadership."
  - "My BE in Electrical & Electronics Engineering and my in-progress MS in Computer Science (AI & ML) at Woolf University let me work through AKS and OAuth design with architects, then explain the trade-offs to a steering committee in plain language. Every view gets a fair hearing, and the team lands on what's right for the work, not on what the loudest voice wants."

clients:
  - Walmart
