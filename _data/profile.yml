about_title: Delivery leader. Engineer by training. Teacher by habit.
about:
  - I lead programmes where the stakes are real. Millions of policyholders, regulated data, and executives who need a straight answer on whether a release will land.
  - "Right now I run release governance for Manulife's Core API, Customer Engagement and Compliance AI products and report portfolio health straight to executive leadership. The portfolio holds a High health rating with under 5% sprint variance and zero critical security issues. Before that I spent three years on-site in Boston for John Hancock, where I restarted a platform programme that had been frozen for two years and ran five modernization initiatives across 20+ business divisions."
  - I hold a BE in Electrical & Electronics Engineering and I'm now studying for an MS in Computer Science with a focus on AI & ML at Woolf University. That mix lets me sit with architects on AKS migrations and OAuth design, then walk into a steering committee and explain it in plain language.

clients:
