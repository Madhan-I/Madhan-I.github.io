# Site settings. You rarely need to touch this file.
# Your page content is in _data/profile.yml. Blog posts are in _posts/.

title: Madhan Irulandi
tagline: Senior Release Train Engineer & Program Manager
description: Senior Release Train Engineer and Program Manager in Chennai. SAFe 6, Azure AI, Microsoft Certified Trainer. Available for leadership roles and corporate training.
author: Madhan Irulandi
lang: en

# After you publish, put your live address here, e.g. https://madhan-i.github.io
url: "https://madhanirulandi.com"
# Leave empty if your repository is named <username>.github.io
baseurl: ""

# Picture shown when someone shares your link on LinkedIn, WhatsApp or X.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/madhan-headshot-bright.jpg

social:
  name: Madhan Irulandi
  links:
    - https://www.linkedin.com/in/madhanirulandi

permalink: /blog/:year/:month/:title/
# Posts dated in the future stay hidden until their date.
# A daily GitHub job (.github/workflows/weekly-publish.yml) rebuilds the site so they appear on time.
future: false
timezone: Asia/Kolkata

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

feed:
  path: blog/feed.xml

exclude:
  - README.md
  - .pagescms.yml

# Visitor counts (free, no cookies, no consent banner needed): sign up at goatcounter.com,
# then put your code here, e.g. goatcounter: "madhanirulandi". Leave empty to switch off.
goatcounter: ""
